[project]
name = "driftcheck"
version = "0.1.0"
description = "Verify the factual claims in agent-context docs (CLAUDE.md, runbooks) against the live system."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "sauravmodi" }]
keywords = ["mcp", "agents", "claude", "documentation", "drift", "ops"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/sauravmodi03/driftcheck-mcp"
Issues = "https://github.com/sauravmodi03/driftcheck-mcp/issues"
Changelog = "https://github.com/sauravmodi03/driftcheck-mcp/blob/main/CHANGELOG.md"

[project.optional-dependencies]
mcp = ["mcp>=2.0"]

[project.scripts]
driftcheck = "driftcheck.cli:main"
driftcheck-mcp = "driftcheck.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["driftcheck"]
